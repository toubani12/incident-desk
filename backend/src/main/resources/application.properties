spring.application.name=incident-desk-api
server.port=${PORT:8085}

# ---------------------------------------------------------------
# Base de données : H2 en mémoire par défaut (profil "mysql" dispo)
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:incidentdesk;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------
# JWT
#  - access token  : 5 minutes (valeur de test demandée dans l'énoncé)
#  - refresh token : 24 heures
# Le secret doit être remplacé en production (variable JWT_SECRET)
# ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:FDEScaZ2iIiqkdhBbZc4GUxPvm6K5UjkkUO5LC52m7WjZ31u+TmN4E+mgD42qce5}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:5m}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:24h}
app.jwt.issuer=incident-desk-api

# ---------------------------------------------------------------
# CORS : frontend Next.js (3000) + Vite (5173)
# ---------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Comptes de démonstration créés au démarrage si la base est vide
app.seed.enabled=true

logging.level.ma.enset.incidentdesk=INFO
