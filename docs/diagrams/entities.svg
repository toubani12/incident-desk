<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 830" width="1240" height="830" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C3E50"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #BDC3C7; stroke-width: 1.2; }
      .head { fill: #2C3E50; }
      .title { fill: #ffffff; font-weight: 700; font-size: 15px; }
      .table { fill: #AFC4D6; font-size: 11px; }
      .f { fill: #2C3E50; font-size: 12.5px; }
      .pk { fill: #C0392B; font-weight: 700; font-size: 12.5px; }
      .fk { fill: #1A5276; font-weight: 700; font-size: 12.5px; }
      .t { fill: #7F8C8D; font-size: 12px; }
      .alt { fill: #EBF5FB; }
      .rel { fill: none; stroke: #2C3E50; stroke-width: 1.6; }
      .relu { fill: none; stroke: #7F8C8D; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .lbl { fill: #1A5276; font-size: 11.5px; font-weight: 700; }
      .lbl2 { fill: #7F8C8D; font-size: 11px; font-style: italic; }
      .card { fill: #C0392B; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1240" height="830" fill="#ffffff"/>
  <text x="40" y="26" font-size="13" fill="#7F8C8D">Diagramme des entités JPA — Incident Desk</text>

  <!-- ============ Incident ============ -->
  <g transform="translate(470,40)">
    <rect class="box" width="300" height="268" rx="6"/>
    <rect class="head" width="300" height="38" rx="6"/><rect class="head" y="20" width="300" height="18"/>
    <text class="title" x="14" y="25">Incident</text><text class="table" x="286" y="25" text-anchor="end">table incidents</text>
    <rect class="alt" x="1" y="60" width="298" height="22"/><rect class="alt" x="1" y="104" width="298" height="22"/>
    <rect class="alt" x="1" y="148" width="298" height="22"/><rect class="alt" x="1" y="192" width="298" height="22"/>
    <rect class="alt" x="1" y="236" width="298" height="22"/>
    <text x="14" y="55" class="pk">PK id</text><text x="286" y="55" class="t" text-anchor="end">Long</text>
    <text x="14" y="77" class="f">title</text><text x="286" y="77" class="t" text-anchor="end">String(150)</text>
    <text x="14" y="99" class="f">description</text><text x="286" y="99" class="t" text-anchor="end">String(3000)</text>
    <text x="14" y="121" class="f">category</text><text x="286" y="121" class="t" text-anchor="end">IncidentCategory</text>
    <text x="14" y="143" class="f">priority</text><text x="286" y="143" class="t" text-anchor="end">IncidentPriority</text>
    <text x="14" y="165" class="f">status</text><text x="286" y="165" class="t" text-anchor="end">IncidentStatus</text>
    <text x="14" y="187" class="f">createdAt</text><text x="286" y="187" class="t" text-anchor="end">Instant</text>
    <text x="14" y="209" class="f">updatedAt</text><text x="286" y="209" class="t" text-anchor="end">Instant</text>
    <text x="14" y="231" class="fk">FK createdBy</text><text x="286" y="231" class="t" text-anchor="end">User (NOT NULL)</text>
    <text x="14" y="253" class="fk">FK assignedTo</text><text x="286" y="253" class="t" text-anchor="end">User (nullable)</text>
  </g>

  <!-- ============ User ============ -->
  <g transform="translate(40,250)">
    <rect class="box" width="270" height="200" rx="6"/>
    <rect class="head" width="270" height="38" rx="6"/><rect class="head" y="20" width="270" height="18"/>
    <text class="title" x="14" y="25">User</text><text class="table" x="256" y="25" text-anchor="end">table users</text>
    <rect class="alt" x="1" y="60" width="268" height="22"/><rect class="alt" x="1" y="104" width="268" height="22"/><rect class="alt" x="1" y="148" width="268" height="22"/>
    <text x="14" y="55" class="pk">PK id</text><text x="256" y="55" class="t" text-anchor="end">Long</text>
    <text x="14" y="77" class="f">fullName</text><text x="256" y="77" class="t" text-anchor="end">String(100)</text>
    <text x="14" y="99" class="f">email</text><text x="256" y="99" class="t" text-anchor="end">String · UNIQUE</text>
    <text x="14" y="121" class="f">password</text><text x="256" y="121" class="t" text-anchor="end">hash BCrypt</text>
    <text x="14" y="143" class="f">role</text><text x="256" y="143" class="t" text-anchor="end">Role</text>
    <text x="14" y="165" class="f">enabled</text><text x="256" y="165" class="t" text-anchor="end">boolean</text>
    <text x="14" y="187" class="f">createdAt</text><text x="256" y="187" class="t" text-anchor="end">Instant</text>
  </g>

  <!-- ============ RefreshToken ============ -->
  <g transform="translate(40,568)">
    <rect class="box" width="270" height="178" rx="6"/>
    <rect class="head" width="270" height="38" rx="6"/><rect class="head" y="20" width="270" height="18"/>
    <text class="title" x="14" y="25">RefreshToken</text><text class="table" x="256" y="25" text-anchor="end">refresh_tokens</text>
    <rect class="alt" x="1" y="60" width="268" height="22"/><rect class="alt" x="1" y="104" width="268" height="22"/><rect class="alt" x="1" y="148" width="268" height="22"/>
    <text x="14" y="55" class="pk">PK id</text><text x="256" y="55" class="t" text-anchor="end">Long</text>
    <text x="14" y="77" class="f">tokenHash</text><text x="256" y="77" class="t" text-anchor="end">SHA-256 · UNIQUE</text>
    <text x="14" y="99" class="fk">FK user</text><text x="256" y="99" class="t" text-anchor="end">User</text>
    <text x="14" y="121" class="f">expiresAt</text><text x="256" y="121" class="t" text-anchor="end">Instant</text>
    <text x="14" y="143" class="f">revoked</text><text x="256" y="143" class="t" text-anchor="end">boolean</text>
    <text x="14" y="165" class="f">createdAt</text><text x="256" y="165" class="t" text-anchor="end">Instant</text>
  </g>

  <!-- ============ IncidentHistory ============ -->
  <g transform="translate(930,40)">
    <rect class="box" width="270" height="222" rx="6"/>
    <rect class="head" width="270" height="38" rx="6"/><rect class="head" y="20" width="270" height="18"/>
    <text class="title" x="14" y="25">IncidentHistory</text><text class="table" x="256" y="25" text-anchor="end">incident_history</text>
    <rect class="alt" x="1" y="60" width="268" height="22"/><rect class="alt" x="1" y="104" width="268" height="22"/>
    <rect class="alt" x="1" y="148" width="268" height="22"/><rect class="alt" x="1" y="192" width="268" height="22"/>
    <text x="14" y="55" class="pk">PK id</text><text x="256" y="55" class="t" text-anchor="end">Long</text>
    <text x="14" y="77" class="fk">FK incident</text><text x="256" y="77" class="t" text-anchor="end">Incident</text>
    <text x="14" y="99" class="f">type</text><text x="256" y="99" class="t" text-anchor="end">HistoryType</text>
    <text x="14" y="121" class="f">fromStatus</text><text x="256" y="121" class="t" text-anchor="end">IncidentStatus</text>
    <text x="14" y="143" class="f">toStatus</text><text x="256" y="143" class="t" text-anchor="end">IncidentStatus</text>
    <text x="14" y="165" class="f">message</text><text x="256" y="165" class="t" text-anchor="end">String(300)</text>
    <text x="14" y="187" class="fk">FK performedBy</text><text x="256" y="187" class="t" text-anchor="end">User</text>
    <text x="14" y="209" class="f">createdAt</text><text x="256" y="209" class="t" text-anchor="end">Instant</text>
  </g>

  <!-- ============ IncidentComment ============ -->
  <g transform="translate(930,420)">
    <rect class="box" width="270" height="156" rx="6"/>
    <rect class="head" width="270" height="38" rx="6"/><rect class="head" y="20" width="270" height="18"/>
    <text class="title" x="14" y="25">IncidentComment</text><text class="table" x="256" y="25" text-anchor="end">incident_comments</text>
    <rect class="alt" x="1" y="60" width="268" height="22"/><rect class="alt" x="1" y="104" width="268" height="22"/>
    <text x="14" y="55" class="pk">PK id</text><text x="256" y="55" class="t" text-anchor="end">Long</text>
    <text x="14" y="77" class="fk">FK incident</text><text x="256" y="77" class="t" text-anchor="end">Incident</text>
    <text x="14" y="99" class="fk">FK author</text><text x="256" y="99" class="t" text-anchor="end">User</text>
    <text x="14" y="121" class="f">content</text><text x="256" y="121" class="t" text-anchor="end">String(2000)</text>
    <text x="14" y="143" class="f">createdAt</text><text x="256" y="143" class="t" text-anchor="end">Instant</text>
  </g>

  <!-- ============ Enums ============ -->
  <g transform="translate(430,420)">
    <rect class="box" width="400" height="214" rx="6" stroke-dasharray="4 3"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#1E8449">«enum»</text>
    <text x="16" y="52" class="f"><tspan font-weight="700">Role</tspan> : EMPLOYEE · TECHNICIAN · ADMIN</text>
    <text x="16" y="78" class="f"><tspan font-weight="700">IncidentCategory</tspan> : NETWORK · MALWARE · PHISHING</text>
    <text x="16" y="96" class="f">· ACCESS · SOFTWARE · HARDWARE · DATA_LEAK · OTHER</text>
    <text x="16" y="122" class="f"><tspan font-weight="700">IncidentPriority</tspan> : LOW · MEDIUM · HIGH · CRITICAL</text>
    <text x="16" y="148" class="f"><tspan font-weight="700">IncidentStatus</tspan> : OPEN · ASSIGNED · IN_PROGRESS</text>
    <text x="16" y="166" class="f">· RESOLVED · CLOSED (terminal)</text>
    <text x="16" y="192" class="f"><tspan font-weight="700">HistoryType</tspan> : CREATED · ASSIGNED</text>
    <text x="16" y="208" class="f">· STATUS_CHANGED · NOTE_ADDED</text>
  </g>

  <!-- ============ Relations ============ -->
  <path class="rel" d="M470,271 H400 V300 H312" marker-end="url(#arrow)"/>
  <text class="card" x="452" y="265">N</text><text class="card" x="318" y="294">1</text>
  <text class="lbl" x="334" y="236">createdBy</text>
  <text class="lbl2" x="322" y="250">@ManyToOne(LAZY)</text>

  <path class="rel" d="M470,293 H420 V345 H312" marker-end="url(#arrow)"/>
  <text class="card" x="452" y="309">N</text><text class="card" x="316" y="339">0..1</text>
  <text class="lbl" x="326" y="366">assignedTo</text>
  <text class="lbl2" x="326" y="380">@ManyToOne(LAZY)</text>

  <path class="rel" d="M930,140 H772" marker-end="url(#arrow)"/>
  <text class="card" x="776" y="134">1</text><text class="card" x="912" y="134">N</text>
  <text class="lbl" x="795" y="160">history</text>
  <text class="lbl2" x="795" y="174">@OneToMany(mappedBy)</text>
  <text class="lbl2" x="795" y="188">cascade ALL,</text>
  <text class="lbl2" x="795" y="202">orphanRemoval</text>

  <path class="rel" d="M930,470 H860 V250 H772" marker-end="url(#arrow)"/>
  <text class="card" x="776" y="244">1</text><text class="card" x="912" y="464">N</text>
  <text class="lbl" x="868" y="300">comments</text>
  <text class="lbl2" x="868" y="314">@OneToMany</text>
  <text class="lbl2" x="868" y="328">(mappedBy)</text>

  <path class="relu" d="M1065,262 V396 H350 V410 H312" marker-end="url(#arrow)"/>
  <text class="lbl2" x="600" y="390">performedBy → User (@ManyToOne LAZY)</text>

  <path class="relu" d="M1065,576 V800 H340 V430 H312" marker-end="url(#arrow)"/>
  <text class="lbl2" x="600" y="794">author → User (@ManyToOne LAZY)</text>

  <path class="rel" d="M175,568 V452" marker-end="url(#arrow)"/>
  <text class="card" x="182" y="560">N</text><text class="card" x="182" y="470">1</text>
  <text class="lbl" x="196" y="512">user</text>
  <text class="lbl2" x="196" y="526">@ManyToOne(LAZY)</text>
</svg>
